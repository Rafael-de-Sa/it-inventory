name: Testes

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest

    # Algumas migrations usam comandos exclusivos do MySQL, então os testes rodam no mesmo banco da produção.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: it_inventory_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Host e credenciais do banco; o nome (it_inventory_testing) vem do phpunit.xml.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, intl, zip, dom
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Cache do Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build dos assets (manifest do Vite usado pelas views)
        run: |
          npm ci
          npm run build

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testes
        run: composer test
